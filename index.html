<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Torre de Hanoi</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
  }

  .game {
    position: relative;
    width: 700px;
    height: 320px;
  }

  .base {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 650px;
    height: 28px;
    background: #dcbfa3;
    border-radius: 4px;
    border-bottom: 3px solid #b08f6f;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  .peg {
    position: absolute;
    bottom: 48px;
    width: 16px;
    height: 180px;
    background: #3e2723;
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .peg:hover { background: #5d4037; }
  .peg:nth-child(1) { left: 120px; }
  .peg:nth-child(2) { left: 342px; }
  .peg:nth-child(3) { left: 564px; }

  .disk {
    position: absolute;
    height: 34px;
    border-radius: 5px;
    cursor: pointer;
    transition: left 0.4s ease, bottom 0.4s ease, transform 0.2s;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.15);
    left: 50%;
    transform: translateX(-50%);
  }
  .disk.lifted {
    transform: translateX(-50%) translateY(-25px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.4);
  }

  /* De MENOR a MAYOR (arriba → abajo) */
  .d1 { width: 70px;  background: #f1c40f; }
  .d2 { width: 110px; background: #2ecc71; }
  .d3 { width: 150px; background: #e74c3c; }
  .d4 { width: 190px; background: #3498db; }
  .d5 { width: 230px; background: #f1c40f; }

  .info {
    margin-top: 25px;
    font-size: 14px;
    color: #555;
    font-style: italic;
  }
  .msg {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
</style>
</head>
<body>

<div class="game" id="game">
  <div class="msg" id="msg">Haz clic en un poste para tomar el disco superior</div>
  <div class="base"></div>
  <div class="peg" data-peg="0"></div>
  <div class="peg" data-peg="1"></div>
  <div class="peg" data-peg="2"></div>
  <div id="disks"></div>
</div>

<div class="info">Diseño Vibe Coding por Ing. Hernán Quiroz</div>

<script>
  // Estado: cada poste es un array. El ÚLTIMO elemento es el disco de ARRIBA.
  // Torre inicial en poste derecho (índice 2), de MENOR a MAYOR de arriba hacia abajo.
  // Array: [5,4,3,2,1] → 5 abajo, 1 arriba (el tope es el último: 1)
  const towers = [
    [],
    [],
    [5, 4, 3, 2, 1]
  ];

  const pegX = [120, 342, 564]; // posición X de cada poste
  let selected = null; // índice del poste seleccionado (0,1,2) o null

  const disksDiv = document.getElementById('disks');
  const msgDiv = document.getElementById('msg');

  function render() {
    disksDiv.innerHTML = '';

    towers.forEach((tower, ti) => {
      tower.forEach((disk, di) => {
        const el = document.createElement('div');
        el.className = 'disk d' + disk;
        // bottom: base(48) + di*36 (altura 34 + separación 2)
        el.style.bottom = (48 + di * 36) + 'px';
        el.style.left = pegX[ti] + 'px';

        // Si este disco es el tope del poste seleccionado, levantarlo
        if (selected === ti && di === tower.length - 1) {
          el.classList.add('lifted');
        }

        disksDiv.appendChild(el);
      });
    });
  }

  function updateMsg(text) {
    msgDiv.textContent = text;
  }

  // Click en postes
  document.querySelectorAll('.peg').forEach(peg => {
    peg.addEventListener('click', () => {
      const ti = parseInt(peg.dataset.peg);

      if (selected === null) {
        // Seleccionar: tomar el tope de este poste
        if (towers[ti].length === 0) {
          updateMsg('⚠️ Ese poste está vacío. Elige otro.');
          return;
        }
        selected = ti;
        updateMsg('Disco seleccionado. Haz clic en otro poste para soltarlo.');
      } else {
        // Intentar mover desde 'selected' hacia 'ti'
        if (selected === ti) {
          // Deseleccionar
          selected = null;
          updateMsg('Selección cancelada. Haz clic en un poste.');
          render();
          return;
        }

        const movingDisk = towers[selected][towers[selected].length - 1];
        const targetTop = towers[ti].length > 0 ? towers[ti][towers[ti].length - 1] : Infinity;

        if (movingDisk < targetTop) {
          // Movimiento válido
          towers[selected].pop();
          towers[ti].push(movingDisk);
          selected = null;
          updateMsg('✅ Movimiento válido. ¡Sigue!');

          // Verificar victoria
          if (towers[1].length === 5 || towers[0].length === 5) {
            updateMsg('🎉 ¡GANASTE! Torre completada.');
          }
        } else {
          updateMsg('❌ No puedes poner un disco grande sobre uno pequeño.');
          selected = null;
        }
      }
      render();
    });
  });

  render();
</script>

</body>
</html>
