<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Torre de Hanoi</title>
<style>
  body {
    margin: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: Arial, sans-serif;
    user-select: none;
  }

  .game {
    position: relative;
    width: 700px;
    height: 320px;
  }

  .base {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    width: 650px;
    height: 28px;
    background: #dcbfa3;
    border-radius: 4px;
    border-bottom: 3px solid #b08f6f;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }

  /* Área de click amplia para cada poste */
  .peg-zone {
    position: absolute;
    bottom: 48px;
    width: 120px;
    height: 220px;
    cursor: pointer;
    z-index: 5;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .peg-zone:hover {
    background: rgba(255,255,255,0.08);
  }
  .peg-zone.active {
    background: rgba(255,255,0,0.15);
  }
  .peg-zone:nth-child(1) { left: 60px; }
  .peg-zone:nth-child(2) { left: 290px; }
  .peg-zone:nth-child(3) { left: 520px; }

  /* Poste visual (solo decorativo) */
  .peg-visual {
    position: absolute;
    bottom: 48px;
    width: 16px;
    height: 180px;
    background: #3e2723;
    border-radius: 3px;
    pointer-events: none;
  }
  .peg-visual:nth-child(4) { left: 112px; }
  .peg-visual:nth-child(5) { left: 342px; }
  .peg-visual:nth-child(6) { left: 572px; }

  /* Los discos: pointer-events: none para que el click pase a la zona */
  .disk {
    position: absolute;
    height: 34px;
    border-radius: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    border: 1px solid rgba(0,0,0,0.15);
    pointer-events: none;
    transition: left 0.4s ease, bottom 0.4s ease, transform 0.2s;
    left: 50%;
    transform: translateX(-50%);
  }
  .disk.lifted {
    transform: translateX(-50%) translateY(-30px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.5);
  }

  /* De MENOR a MAYOR (arriba → abajo) */
  .d1 { width: 70px;  background: #f1c40f; }
  .d2 { width: 110px; background: #2ecc71; }
  .d3 { width: 150px; background: #e74c3c; }
  .d4 { width: 190px; background: #3498db; }
  .d5 { width: 230px; background: #f1c40f; }

  .info {
    margin-top: 25px;
    font-size: 14px;
    color: #555;
    font-style: italic;
  }
  .msg {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.95);
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    z-index: 100;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="game" id="game">
  <div class="msg" id="msg">Haz clic en un poste para tomar el disco superior</div>
  <div class="base"></div>

  <!-- Zonas de click (invisibles, amplias) -->
  <div class="peg-zone" data-peg="0"></div>
  <div class="peg-zone" data-peg="1"></div>
  <div class="peg-zone" data-peg="2"></div>

  <!-- Postes visuales (solo decoración) -->
  <div class="peg-visual"></div>
  <div class="peg-visual"></div>
  <div class="peg-visual"></div>

  <div id="disks"></div>
</div>

<div class="info">Diseño Vibe Coding por Ing. Hernán Quiroz</div>

<script>
  // Torre inicial en poste derecho (índice 2)
  // Array: [5,4,3,2,1] → 5 abajo, 1 arriba (tope = último elemento = 1)
  const towers = [
    [],
    [],
    [5, 4, 3, 2, 1]
  ];

  const pegX = [120, 342, 572]; // centro X de cada poste
  let selected = null;

  const disksDiv = document.getElementById('disks');
  const msgDiv = document.getElementById('msg');
  const zones = document.querySelectorAll('.peg-zone');

  function render() {
    disksDiv.innerHTML = '';

    towers.forEach((tower, ti) => {
      tower.forEach((disk, di) => {
        const el = document.createElement('div');
        el.className = 'disk d' + disk;
        el.style.bottom = (48 + di * 36) + 'px';
        el.style.left = pegX[ti] + 'px';

        if (selected === ti && di === tower.length - 1) {
          el.classList.add('lifted');
        }

        disksDiv.appendChild(el);
      });
    });

    // Resaltar zona activa
    zones.forEach((z, i) => {
      z.classList.toggle('active', i === selected);
    });
  }

  function setMsg(text) {
    msgDiv.textContent = text;
  }

  zones.forEach(zone => {
    zone.addEventListener('click', () => {
      const ti = parseInt(zone.dataset.peg);

      if (selected === null) {
        if (towers[ti].length === 0) {
          setMsg('⚠️ Ese poste está vacío. Elige otro.');
          return;
        }
        selected = ti;
        setMsg('Disco seleccionado. Haz clic en otro poste para soltarlo.');
      } else {
        if (selected === ti) {
          selected = null;
          setMsg('Selección cancelada.');
        } else {
          const movingDisk = towers[selected][towers[selected].length - 1];
          const targetTop = towers[ti].length > 0 ? towers[ti][towers[ti].length - 1] : Infinity;

          if (movingDisk < targetTop) {
            towers[selected].pop();
            towers[ti].push(movingDisk);
            selected = null;
            setMsg('✅ Movimiento válido.');

            if (towers[0].length === 5 || towers[1].length === 5) {
              setMsg('🎉 ¡GANASTE! Torre completada.');
            }
          } else {
            setMsg('❌ No puedes poner un disco grande sobre uno pequeño.');
            selected = null;
          }
        }
      }
      render();
    });
  });

  render();
</script>

</body>
</html>
